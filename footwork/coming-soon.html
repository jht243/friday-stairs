<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Coming Soon — Friday Stairs</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
<style>
  :root {
    --fs-cream: #FFF9DE;
    --fs-dark: #282424;
    --fs-yellow: #FFE57B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--fs-cream); color: var(--fs-dark); min-height: 100vh; }
  body {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; width: 100%; }

  header.site { padding: 32px 0 8px; }
  .logo-bar { display: flex; justify-content: space-between; align-items: flex-end; }
  .fs-logo-wrap {
    width: 200px;
    border-top: 2px solid var(--fs-dark);
    padding-top: 10px;
    display: inline-block;
    overflow: hidden;
  }
  .fs-logo-img {
    display: block;
    width: 262px !important;
    max-width: none !important;
    height: 42px !important;
    object-fit: cover;
    object-position: center;
    margin: 0 0 0 -37px !important;
    padding: 0 !important;
    border: 0 !important;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 28px;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 12px;
    margin-bottom: 24px;
    opacity: 0.6;
  }
  .eyebrow .dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--fs-yellow);
    margin-right: 10px;
    transform: translateY(-1px);
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900;
    font-size: clamp(40px, 6vw, 72px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0 0 24px;
  }
  h1 .accent {
    background: linear-gradient(transparent 62%, var(--fs-yellow) 62%);
    padding: 0 .08em;
  }

  .lede {
    font-size: 18px;
    line-height: 1.6;
    max-width: 44ch;
    margin: 0 0 40px;
    opacity: 0.8;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fs-dark);
    text-decoration: none;
    border-bottom: 2px solid var(--fs-yellow);
    padding-bottom: 2px;
  }
  .back-link:hover { color: var(--fs-dark); border-bottom-color: var(--fs-dark); }

  footer.site {
    background: var(--fs-dark);
    border-top: 4px solid var(--fs-yellow);
    padding: 24px 32px;
    text-align: center;
    color: var(--fs-cream);
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  footer.site a { color: var(--fs-yellow); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <div class="logo-bar">
      <div class="fs-logo-wrap">
        <img src="assets/fs-logo.png" alt="Friday Stairs" class="fs-logo-img" />
      </div>
    </div>
  </header>
</div>

<div class="main">
  <div class="eyebrow"><span class="dot"></span>Something's coming</div>
  <h1>Coming <span class="accent">Soon</span></h1>
  <p class="lede">We're working on it. Check back shortly.</p>
  <a class="back-link" href="/">← Back to Friday Stairs</a>
</div>

<footer class="site">
  <div style="margin-bottom: 6px;">LET'S CLIMB</div>
  <a href="sponsorship.html">PARTNER WITH US</a>
</footer>

</body>
</html>
