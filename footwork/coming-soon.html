<style>
  :root {
    --fs-cream: #FFF9DE;
    --fs-dark: #282424;
    --fs-yellow: #FFE57B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--fs-cream); color: var(--fs-dark); min-height: 100vh; }
  body {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; width: 100%; }

  header.site { padding: 32px 0 8px; }
  .logo-bar { display: flex; justify-content: space-between; align-items: flex-end; }
  .fs-logo-wrap {
    width: 200px;
    border-top: 2px solid var(--fs-dark);
    padding-top: 10px;
    display: inline-block;
    overflow: hidden;
  }
  .fs-logo-img {
    display: block;
    width: 262px !important;
    max-width: none !important;
    height: 42px !important;
    object-fit: cover;
    object-position: center;
    margin: 0 0 0 -37px !important;
    padding: 0 !important;
    border: 0 !important;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 28px;
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 12px;
    margin-bottom: 24px;
    opacity: 0.6;
  }
  .eyebrow .dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--fs-yellow);
    margin-right: 10px;
    transform: translateY(-1px);
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900;
    font-size: clamp(40px, 6vw, 72px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 0 0 24px;
  }
  h1 .accent {
    background: linear-gradient(transparent 62%, var(--fs-yellow) 62%);
    padding: 0 .08em;
  }

  .lede {
    font-size: 18px;
    line-height: 1.6;
    max-width: 44ch;
    margin: 0 0 40px;
    opacity: 0.8;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fs-dark);
    text-decoration: none;
    border-bottom: 2px solid var(--fs-yellow);
    padding-bottom: 2px;
  }
  .back-link:hover { color: var(--fs-dark); border-bottom-color: var(--fs-dark); }

  footer.site { background: var(--fs-dark); color: var(--fs-cream); border-top: 4px solid var(--fs-yellow); padding: 28px 0 36px; }
  .footer-inner { max-width: 960px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .footer-logo { width: 150px; height: auto; display: block; }
  .footer-right { display: flex; align-items: center; gap: 24px; }
  .footer-partner-link { color: var(--fs-yellow); text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .footer-partner-link:hover { color: var(--fs-cream); }
  .footer-social { display: flex; gap: 16px; align-items: center; }
  .footer-social a { color: var(--fs-yellow); display: block; line-height: 0; }
  .footer-social a:hover { color: var(--fs-cream); }
</style>
