<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Friday Stairs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fs-cream: #FFF9DE;
      --fs-dark: #282424;
      --fs-yellow: #FFE57B;
      --fs-orange: #F75C0D;
      --fs-green: #2e7d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fs-cream);
      color: var(--fs-dark);
      font-family: 'Playfair Display', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea {
      width: 100%;
      font-family: inherit;
      color: var(--fs-dark);
      background: #fff;
      border: 1.5px solid var(--fs-dark);
      border-radius: 0;
    }
    input:focus, textarea:focus { outline: none; box-shadow: 3px 3px 0 var(--fs-yellow); }
    button {
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--fs-dark);
      background: var(--fs-yellow);
      border: 1.5px solid var(--fs-dark);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--fs-dark);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--fs-dark); }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--fs-dark); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 3px 3px 0 var(--fs-dark); }
    .status { font-size: 13px; font-weight: 700; }
    .status.err { color: var(--fs-orange); }
    .status.ok { color: var(--fs-green); }
    a { color: var(--fs-dark); }
    a:hover { color: var(--fs-orange); }
    .hidden { display: none !important; }

    /* Login */
    .login-card {
      max-width: 340px;
      margin: 12vh auto 0;
      border: 2px solid var(--fs-dark);
      background: #fff;
      padding: 24px 22px;
      box-shadow: 6px 6px 0 var(--fs-yellow);
    }
    .login-card h1 { text-align: center; font-size: 26px; font-weight: 900; margin: 0; }
    .login-card .sub { text-align: center; font-size: 13px; opacity: 0.75; margin: 4px 0 18px; }
    .login-card label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; margin: 0 0 6px; }
    .login-card input { font-size: 16px; padding: 11px 12px; }
    .login-actions { margin-top: 14px; }
    .login-actions button { width: 100%; font-size: 15px; padding: 12px; }
    .login-status { margin-top: 12px; text-align: center; }

    /* Editor — compact */
    .wrap { max-width: 720px; margin: 0 auto; padding: 22px 18px 28px; }
    .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar h1 { font-size: 20px; font-weight: 900; margin: 0 auto 0 0; }
    #save-btn { font-size: 13px; padding: 9px 20px; }
    .logout { background: none; border: none; box-shadow: none; padding: 4px 2px; font-size: 12px; text-decoration: underline; text-transform: none; letter-spacing: 0; }
    .logout:hover { transform: none; box-shadow: none; color: var(--fs-orange); }
    .sub-line { font-size: 12px; opacity: 0.7; margin: 6px 0 16px; }
    .stat-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .stat-row.head { margin-bottom: 4px; }
    .stat-row .num { flex: 0 0 140px; }
    .stat-row .cap { flex: 1 1 auto; }
    .stat-row input { padding: 8px 10px; font-size: 15px; }
    .stat-row input.num { background: var(--fs-cream); font-weight: 900; font-size: 16px; }
    .col-head { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.55; }
    @media (max-width: 560px) {
      .stat-row { flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
      .stat-row .num, .stat-row .cap { flex: 1 1 100%; }
      .stat-row.head { display: none; }
    }
  </style>
</head>
<body>
  <!-- LOGIN VIEW -->
  <div id="login-view">
    <div class="login-card">
      <h1>Friday Stairs</h1>
      <p class="sub">Partner stats dashboard</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" autofocus />
        <div class="login-actions">
          <button type="submit" id="login-btn">Log in</button>
        </div>
        <div id="login-status" class="status login-status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="editor-view" class="wrap hidden">
    <div class="topbar">
      <h1>Partner Stats</h1>
      <span id="status" class="status" aria-live="polite"></span>
      <button id="save-btn" type="button" disabled>Save</button>
      <button type="button" class="logout" id="logout-btn">Log out</button>
    </div>
    <p class="sub-line">Edit the four <a href="/partnership.html" target="_blank" rel="noopener">Partner page</a> stats. Save updates the site instantly.</p>

    <div id="stats-list">Loading…</div>
  </div>

  <script>
    (function () {
      var loginView = document.getElementById('login-view');
      var editorView = document.getElementById('editor-view');
      var loginForm = document.getElementById('login-form');
      var loginBtn = document.getElementById('login-btn');
      var loginStatus = document.getElementById('login-status');
      var pwEl = document.getElementById('password');

      var listEl = document.getElementById('stats-list');
      var saveBtn = document.getElementById('save-btn');
      var statusEl = document.getElementById('status');
      var logoutBtn = document.getElementById('logout-btn');

      var sessionPw = '';   // kept in memory only, never stored
      var stats = [];

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function setStatus(el, msg, kind) {
        el.textContent = msg || '';
        el.className = 'status' + (el === loginStatus ? ' login-status' : '') + (kind ? ' ' + kind : '');
      }

      // ── Login ──────────────────────────────────────────────────────────────
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = pwEl.value;
        if (!pw) { setStatus(loginStatus, 'Enter the password.', 'err'); return; }
        loginBtn.disabled = true;
        setStatus(loginStatus, 'Checking…');
        fetch('/api/dashboard-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        })
          .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
          .then(function (out) {
            loginBtn.disabled = false;
            if (!out.body.ok) {
              setStatus(loginStatus, out.body.error || 'Incorrect password.', 'err');
              pwEl.select();
              return;
            }
            sessionPw = pw;
            setStatus(loginStatus, '');
            loginView.classList.add('hidden');
            editorView.classList.remove('hidden');
            loadStats();
          })
          .catch(function () {
            loginBtn.disabled = false;
            setStatus(loginStatus, 'Could not reach the server. Try again.', 'err');
          });
      });

      logoutBtn.addEventListener('click', function () {
        sessionPw = '';
        stats = [];
        pwEl.value = '';
        editorView.classList.add('hidden');
        loginView.classList.remove('hidden');
        setStatus(loginStatus, '');
        pwEl.focus();
      });

      // ── Editor ─────────────────────────────────────────────────────────────
      function renderList() {
        var head =
          '<div class="stat-row head">' +
            '<span class="num col-head">Number</span>' +
            '<span class="cap col-head">Caption</span>' +
          '</div>';
        listEl.innerHTML = head + stats.map(function (s, i) {
          return (
            '<div class="stat-row">' +
              '<input class="num" data-i="' + i + '" data-k="value" value="' + esc(s.value) + '" maxlength="40" aria-label="Stat ' + (i + 1) + ' number" />' +
              '<input class="cap" data-i="' + i + '" data-k="label" value="' + esc(s.label) + '" maxlength="200" aria-label="Stat ' + (i + 1) + ' caption" />' +
            '</div>'
          );
        }).join('');

        listEl.querySelectorAll('[data-i]').forEach(function (el) {
          el.addEventListener('input', function () {
            stats[Number(el.getAttribute('data-i'))][el.getAttribute('data-k')] = el.value;
            setStatus(statusEl, '');
          });
        });
      }

      function loadStats() {
        listEl.textContent = 'Loading current stats…';
        saveBtn.disabled = true;
        fetch('/api/partner-stats')
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (!res.ok || !res.stats) throw new Error(res.error || 'Could not load stats.');
            stats = res.stats;
            renderList();
            saveBtn.disabled = false;
          })
          .catch(function (err) {
            listEl.textContent = '';
            setStatus(statusEl, err.message || 'Could not load stats.', 'err');
          });
      }

      function save() {
        if (!sessionPw) { logoutBtn.click(); return; }
        for (var i = 0; i < stats.length; i++) {
          if (!String(stats[i].value).trim() || !String(stats[i].label).trim()) {
            setStatus(statusEl, 'Every stat needs a number and a caption.', 'err');
            return;
          }
        }
        saveBtn.disabled = true;
        setStatus(statusEl, 'Saving…');
        fetch('/api/partner-stats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: sessionPw, stats: stats })
        })
          .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
          .then(function (out) {
            saveBtn.disabled = false;
            if (out.status === 401) {
              // Password changed/expired — bounce back to login.
              setStatus(statusEl, 'Session expired. Please log in again.', 'err');
              logoutBtn.click();
              return;
            }
            if (!out.body.ok) {
              setStatus(statusEl, out.body.error || 'Something went wrong.', 'err');
              return;
            }
            if (out.body.stats) { stats = out.body.stats; renderList(); }
            setStatus(statusEl, 'Saved! The Partner page is now updated.', 'ok');
          })
          .catch(function () {
            saveBtn.disabled = false;
            setStatus(statusEl, 'Could not reach the server. Try again.', 'err');
          });
      }

      saveBtn.addEventListener('click', save);
    })();
  </script>
</body>
</html>
